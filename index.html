<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor Meetup</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a1a2e, #0f0f14 60%);
        color: #f5f5f7;
      }

      main {
        max-width: 40rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }

      p {
        opacity: 0.85;
      }

      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cursor Meetup</h1>
      <p>Workspace scaffold for demos, exercises, and notes.</p>
      <p>Add content under <code>demos/</code>, <code>exercises/</code>, and <code>notes/</code>.</p>
    </main>
  </body>
</html>
